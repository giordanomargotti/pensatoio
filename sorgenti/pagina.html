<title>Pensatoio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style id="stile">
/* Layout: quaderno con margine. Testata su carta a quadretti; date e dati della scheda nella colonna di margine, testo nella colonna di lettura. */
:root {
  --paper: #ffffff;
  --ink: #15181d;
  --muted: #5d6571;
  --rule: #e1e5eb;
  --grid: #e7ebf1;
  --accent: #1f43a3;
  --wash: #edf1fb;
  --panel: #ffffff;
  --shadow: 0 14px 34px rgba(16, 24, 40, .13), 0 2px 6px rgba(16, 24, 40, .06);
  --c1: #2a78d6;
  --c2: #eb6834;
  --c3: #1baf7a;
  --c4: #eda100;
  --c5: #e87ba4;
  --c6: #008300;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --measure: 66ch;
  --margin-col: 196px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1217;
    --ink: #e6e9ee;
    --muted: #99a1ad;
    --rule: #262c35;
    --grid: #181d25;
    --accent: #93acf6;
    --wash: #19223c;
    --panel: #151920;
    --shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    --c1: #3987e5;
    --c2: #d95926;
    --c3: #199e70;
    --c4: #c98500;
    --c5: #d55181;
    --c6: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1217;
  --ink: #e6e9ee;
  --muted: #99a1ad;
  --rule: #262c35;
  --grid: #181d25;
  --accent: #93acf6;
  --wash: #19223c;
  --panel: #151920;
  --shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  --c1: #3987e5;
  --c2: #d95926;
  --c3: #199e70;
  --c4: #c98500;
  --c5: #d55181;
  --c6: #008300;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
::selection { background: var(--wash); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.wrap {
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Testata */
.masthead {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  border-bottom: 1px solid var(--rule);
}
.masthead .wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  padding-block: clamp(36px, 8vw, 96px) clamp(32px, 6vw, 72px);
}
.kicker {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.4;
  letter-spacing: .01em;
  color: var(--muted);
}
.wordmark {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-weight: 800;
  /* La parola in Archivo largo misura circa 7,64 volte la dimensione del carattere: così sta sempre dentro i margini, anche sul telefono */
  font-size: min(136px, 11.6vw);
  font-size: min(136px, calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px))) / 7.9));
  line-height: .88;
  letter-spacing: .005em;
  text-transform: uppercase;
}
.motto {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: clamp(13px, 1.6vw, 17px);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 14px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 0;
  cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .55; cursor: progress; }
.link-btn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

/* Barra con i menu a tendina */
.toolbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.toolbar .wrap {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
}
.dd-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 10px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  cursor: pointer;
}
.dd-btn:hover { border-color: var(--muted); }
.dd-btn[aria-expanded="true"] { border-color: var(--ink); }
.dd-btn.on { color: var(--accent); border-color: var(--accent); }
.chev { flex: none; transition: transform .15s ease; }
.dd-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

.dd-panel {
  position: absolute;
  z-index: 30;
  top: 100%;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  max-height: min(70vh, 560px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 0;
  background: var(--panel);
  border: 1px solid var(--ink);
  box-shadow: var(--shadow);
}
@media (min-width: 760px) {
  .dd { position: relative; }
  .dd-panel { top: calc(100% + 6px); left: 0; right: auto; width: 420px; }
}
.dd-item, .dd-group {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 14px;
  width: 100%;
  padding: 9px 16px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-display);
}
.dd-item { font-size: 15px; line-height: 1.35; color: var(--ink); }
.dd-item .t { min-width: 0; }
.dd-item .n {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dd-item .sub {
  grid-column: 1 / -1;
  font-family: var(--font-text);
  font-style: italic;
  font-size: 14px;
  line-height: 1.35;
  color: var(--muted);
}
.dd-sub { padding-left: 30px; font-size: 14px; }
.dd-item:hover, .dd-group:hover,
.dd-item:focus-visible, .dd-group:focus-visible { background: var(--wash); outline-offset: -2px; }
.dd-item[aria-pressed="true"] .t { color: var(--accent); font-weight: 600; }
.dd-group {
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.dd-group[aria-pressed="true"] { color: var(--accent); }

/* Contenuto */
#vista {
  min-height: 50vh;
  padding-block: clamp(22px, 4vw, 44px) clamp(48px, 7vw, 88px);
}
.sel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 8px;
  border-top: 2px solid var(--ink);
}
.sel-head h2 {
  margin: 0;
  min-width: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.chiudi {
  flex: none;
  width: 36px;
  height: 36px;
  margin-right: -8px;
  font-size: 22px;
  line-height: 1;
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
}
.chiudi:hover { color: var(--ink); background: var(--wash); }
.vuoto { margin: 0; padding-top: 20px; color: var(--muted); }

.entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px 40px;
  padding-block: 22px 26px;
  border-top: 1px solid var(--rule);
}
.sel-head + .entry { border-top: 0; }
.entry-margin {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.entry-margin:empty { display: none; }
.entry-body { min-width: 0; max-width: var(--measure); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.entry-title {
  margin: 0;
  font-family: var(--font-text);
  font-size: clamp(21px, 2.4vw, 25px);
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
}
.entry[data-apri] { cursor: pointer; }
.entry-link {
  display: inline;
  padding: 0;
  font: inherit;
  line-height: inherit;
  text-align: left;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
}
.entry:hover .entry-link { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.entry-more {
  justify-self: start;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
}
.entry-more span { display: inline-block; transition: transform .15s ease; }
.entry:hover .entry-more span { transform: translateX(3px); }
.entry-concept {
  margin: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
@media (min-width: 900px) {
  .entry { grid-template-columns: var(--margin-col) minmax(0, 1fr); }
  .entry-margin { flex-direction: column; padding-top: 4px; }
  .entry-margin:empty { display: block; }
}

/* Scheda */
.scheda-top { margin-bottom: 18px; }
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
}
.back:hover { color: var(--accent); }
.scheda-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  padding-bottom: 22px;
  border-bottom: 2px solid var(--ink);
}
.scheda-title {
  margin: 0;
  max-width: 28ch;
  font-family: var(--font-text);
  font-size: clamp(30px, 4.6vw, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.012em;
  text-wrap: balance;
}
.scheda-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px 40px;
  padding-top: 22px;
}
.scheda-meta dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 20px;
}
.scheda-meta dt {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.scheda-meta dd {
  margin: 3px 0 0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.scheda-meta .link-btn { font-family: var(--font-mono); font-size: 13px; text-align: left; }
.scheda-body { min-width: 0; max-width: var(--measure); display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.block h3 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.concept { margin: 0; font-size: clamp(19px, 2.2vw, 22px); line-height: 1.5; font-style: italic; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.points li { position: relative; padding-left: 24px; }
.points li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: .62em;
  width: 7px;
  height: 7px;
  border: 1.5px solid var(--accent);
}
.points.open li::before {
  content: "?";
  top: 0;
  left: 1px;
  width: auto;
  height: auto;
  border: 0;
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--accent);
}
.sources { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.sources li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.src-type { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.src-main { display: grid; gap: 1px; min-width: 0; }
.src-link {
  justify-self: start;
  padding: 0;
  text-align: left;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.src-link:hover { color: var(--accent); text-decoration-color: currentColor; }
.src-title { font-style: italic; line-height: 1.4; }
.src-year { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--ink); }
.table-wrap table {
  width: 100%;
  min-width: 500px;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.table-wrap th, .table-wrap td {
  padding: 9px 14px 9px 0;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
  border-bottom: 1px solid var(--rule);
}
.table-wrap th:last-child, .table-wrap td:last-child { padding-right: 0; }
.table-wrap thead th {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.table-wrap tbody th { font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.table-wrap .num { text-align: right; }
.table-note { margin: 10px 0 0; font-size: 14px; line-height: 1.5; font-style: italic; color: var(--muted); }
.links { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.links li { display: grid; gap: 2px; }
.links a { font-weight: 600; text-decoration-color: var(--rule); }
.links a:hover { text-decoration-color: currentColor; }
.links .why { font-size: 16px; line-height: 1.5; color: var(--muted); }
.pending { margin: 0; color: var(--muted); }
@media (min-width: 900px) {
  .scheda-head { padding-left: calc(var(--margin-col) + 40px); }
  .scheda-grid { grid-template-columns: var(--margin-col) minmax(0, 1fr); }
  .scheda-meta { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; }
  .scheda-meta dl { grid-template-columns: minmax(0, 1fr); }
}

/* Testo integrale degli articoli */
.testo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; overflow-wrap: break-word; }
.testo > * { margin: 0; min-width: 0; }
.testo h1, .testo h2, .testo h3, .testo h4, .testo h5 {
  margin-top: 18px;
  font-family: var(--font-text);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
  text-wrap: balance;
}
.testo h4 { margin-top: 8px; font-size: 18px; }
.testo h5 {
  margin-top: 6px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.testo ul, .testo ol { padding-left: 1.4em; display: grid; gap: 8px; }
.testo ol li::marker { font-family: var(--font-mono); font-size: .82em; color: var(--muted); }
.testo blockquote { padding-left: 16px; border-left: 2px solid var(--accent); font-size: 19px; line-height: 1.5; font-style: italic; color: var(--muted); }
.testo sup { font-size: .68em; line-height: 0; }
.testo aside {
  display: grid;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.testo aside p { margin: 0; }
.testo pre {
  overflow-x: auto;
  padding: 14px 16px;
  background: var(--wash);
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink);
  -webkit-overflow-scrolling: touch;
}
.testo code { font-family: var(--font-mono); font-size: .9em; }
.testo pre code { font-size: inherit; }
.testo pre kbd { font: inherit; font-weight: 500; color: var(--ink); }
.testo pre samp { font: inherit; color: var(--muted); }
.testo pre i { font-style: normal; color: var(--muted); }
@media (max-width: 420px) { .testo pre { padding: 12px; font-size: 11.5px; } }
.testo table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
.testo th, .testo td { padding: 6px 12px 6px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
.testo a { overflow-wrap: anywhere; }
.img-ph { display: block; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px dashed var(--rule); }

/* Grafici */
.grafico { margin: 6px 0 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.grafico figcaption {
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.45;
  color: var(--muted);
}
.grafico figcaption b { font-weight: 600; color: var(--ink); }
.g-plot { position: relative; min-width: 0; }
.g-plot svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.g-plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.g-grid { stroke: var(--rule); stroke-width: 1; shape-rendering: crispEdges; }
.g-tick { font-family: var(--font-mono); font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.g-axis-title { font-family: var(--font-display); font-size: 12px; fill: var(--muted); }
.g-panel-title { font-family: var(--font-display); font-size: 13px; font-weight: 600; fill: var(--ink); }
.g-panel-unit { font-family: var(--font-display); font-size: 12px; font-weight: 400; fill: var(--muted); }
.g-band { fill: var(--wash); }
.g-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.g-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
.g-err { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; opacity: .45; }
.g-note { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .02em; fill: var(--ink); }
