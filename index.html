<style id="stile">
/* Layout: quaderno con margine. Testata su carta a quadretti; date e dati della scheda nella colonna di margine, testo nella colonna di lettura. */
:root {
  --paper: #ffffff;
  --ink: #15181d;
  --muted: #5d6571;
  --rule: #e1e5eb;
  --grid: #e7ebf1;
  --accent: #1f43a3;
  --wash: #edf1fb;
  --panel: #ffffff;
  --shadow: 0 14px 34px rgba(16, 24, 40, .13), 0 2px 6px rgba(16, 24, 40, .06);
  --c1: #2a78d6;
  --c2: #eb6834;
  --c3: #1baf7a;
  --c4: #eda100;
  --c5: #e87ba4;
  --c6: #008300;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --measure: 66ch;
  --margin-col: 196px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1217;
    --ink: #e6e9ee;
    --muted: #99a1ad;
    --rule: #262c35;
    --grid: #181d25;
    --accent: #93acf6;
    --wash: #19223c;
    --panel: #151920;
    --shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    --c1: #3987e5;
    --c2: #d95926;
    --c3: #199e70;
    --c4: #c98500;
    --c5: #d55181;
    --c6: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1217;
  --ink: #e6e9ee;
  --muted: #99a1ad;
  --rule: #262c35;
  --grid: #181d25;
  --accent: #93acf6;
  --wash: #19223c;
  --panel: #151920;
  --shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  --c1: #3987e5;
  --c2: #d95926;
  --c3: #199e70;
  --c4: #c98500;
  --c5: #d55181;
  --c6: #008300;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
::selection { background: var(--wash); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.wrap {
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Testata */
.masthead {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  border-bottom: 1px solid var(--rule);
}
.masthead .wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  padding-block: clamp(36px, 8vw, 96px) clamp(32px, 6vw, 72px);
}
.kicker {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.4;
  letter-spacing: .01em;
  color: var(--muted);
}
.wordmark {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-weight: 800;
  /* Nome e cognome su una riga: in Archivo largo GIORDANO MARGOTTI misura circa 14,6 volte la dimensione del carattere,
     così sta sempre dentro i margini, anche sul telefono */
  white-space: nowrap;
  font-size: min(72px, 6vw);
  font-size: min(72px, calc((100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px))) / 15));
  line-height: .88;
  letter-spacing: .005em;
  text-transform: uppercase;
}
.motto {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: clamp(13px, 1.6vw, 17px);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 14px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 0;
  cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .55; cursor: progress; }
.link-btn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

/* Barra con i menu a tendina */
.toolbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.toolbar .wrap {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
}
.dd-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 10px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  cursor: pointer;
}
.dd-btn:hover { border-color: var(--muted); }
.dd-btn[aria-expanded="true"] { border-color: var(--ink); }
.dd-btn.on { color: var(--accent); border-color: var(--accent); }
.chev { flex: none; transition: transform .15s ease; }
.dd-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

.dd-panel {
  position: absolute;
  z-index: 30;
  top: 100%;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  max-height: min(70vh, 560px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 0;
  background: var(--panel);
  border: 1px solid var(--ink);
  box-shadow: var(--shadow);
}
@media (min-width: 760px) {
  .dd { position: relative; }
  .dd-panel { top: calc(100% + 6px); left: 0; right: auto; width: 420px; }
}
.dd-item, .dd-group {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 14px;
  width: 100%;
  padding: 9px 16px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-display);
}
.dd-item { font-size: 15px; line-height: 1.35; color: var(--ink); }
.dd-item .t { min-width: 0; }
.dd-item .n {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dd-item .sub {
  grid-column: 1 / -1;
  font-family: var(--font-text);
  font-style: italic;
  font-size: 14px;
  line-height: 1.35;
  color: var(--muted);
}
.dd-sub { padding-left: 30px; font-size: 14px; }
.dd-item:hover, .dd-group:hover,
.dd-item:focus-visible, .dd-group:focus-visible { background: var(--wash); outline-offset: -2px; }
.dd-item[aria-pressed="true"] .t { color: var(--accent); font-weight: 600; }
.dd-group {
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.dd-group[aria-pressed="true"] { color: var(--accent); }

/* Contenuto */
#vista {
  min-height: 50vh;
  padding-block: clamp(22px, 4vw, 44px) clamp(48px, 7vw, 88px);
}
.sel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 8px;
  border-top: 2px solid var(--ink);
}
.sel-head h2 {
  margin: 0;
  min-width: 0;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.chiudi {
  flex: none;
  width: 36px;
  height: 36px;
  margin-right: -8px;
  font-size: 22px;
  line-height: 1;
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
}
.chiudi:hover { color: var(--ink); background: var(--wash); }
.vuoto { margin: 0; padding-top: 20px; color: var(--muted); }

.entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px 40px;
  padding-block: 22px 26px;
  border-top: 1px solid var(--rule);
}
.sel-head + .entry { border-top: 0; }
.entry-margin {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.entry-margin:empty { display: none; }
.entry-body { min-width: 0; max-width: var(--measure); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.entry-title {
  margin: 0;
  font-family: var(--font-text);
  font-size: clamp(21px, 2.4vw, 25px);
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
}
.entry[data-apri] { cursor: pointer; }
.entry-link {
  display: inline;
  padding: 0;
  font: inherit;
  line-height: inherit;
  text-align: left;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
}
.entry:hover .entry-link { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.entry-more {
  justify-self: start;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
}
.entry-more span { display: inline-block; transition: transform .15s ease; }
.entry:hover .entry-more span { transform: translateX(3px); }
.entry-concept {
  margin: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
@media (min-width: 900px) {
  .entry { grid-template-columns: var(--margin-col) minmax(0, 1fr); }
  .entry-margin { flex-direction: column; padding-top: 4px; }
  .entry-margin:empty { display: block; }
}

/* Scheda */
.scheda-top { margin-bottom: 18px; }
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
}
.back:hover { color: var(--accent); }
.scheda-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  padding-bottom: 22px;
  border-bottom: 2px solid var(--ink);
}
.scheda-title {
  margin: 0;
  max-width: 28ch;
  font-family: var(--font-text);
  font-size: clamp(30px, 4.6vw, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.012em;
  text-wrap: balance;
}
.scheda-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px 40px;
  padding-top: 22px;
}
.scheda-meta dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 20px;
}
.scheda-meta dt {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.scheda-meta dd {
  margin: 3px 0 0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.scheda-meta .link-btn { font-family: var(--font-mono); font-size: 13px; text-align: left; }
.scheda-body { min-width: 0; max-width: var(--measure); display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.block h3 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-stretch: 125%;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.concept { margin: 0; font-size: clamp(19px, 2.2vw, 22px); line-height: 1.5; font-style: italic; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.points li { position: relative; padding-left: 24px; }
.points li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: .62em;
  width: 7px;
  height: 7px;
  border: 1.5px solid var(--accent);
}
.points.open li::before {
  content: "?";
  top: 0;
  left: 1px;
  width: auto;
  height: auto;
  border: 0;
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--accent);
}
.sources { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.sources li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.src-type { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.src-main { display: grid; gap: 1px; min-width: 0; }
.src-link {
  justify-self: start;
  padding: 0;
  text-align: left;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.src-link:hover { color: var(--accent); text-decoration-color: currentColor; }
.src-title { font-style: italic; line-height: 1.4; }
.src-year { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--ink); }
.table-wrap table {
  width: 100%;
  min-width: 500px;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.table-wrap th, .table-wrap td {
  padding: 9px 14px 9px 0;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
  border-bottom: 1px solid var(--rule);
}
.table-wrap th:last-child, .table-wrap td:last-child { padding-right: 0; }
.table-wrap thead th {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.table-wrap tbody th { font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.table-wrap .num { text-align: right; }
.table-note { margin: 10px 0 0; font-size: 14px; line-height: 1.5; font-style: italic; color: var(--muted); }
.links { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.links li { display: grid; gap: 2px; }
.links a { font-weight: 600; text-decoration-color: var(--rule); }
.links a:hover { text-decoration-color: currentColor; }
.links .why { font-size: 16px; line-height: 1.5; color: var(--muted); }
.pending { margin: 0; color: var(--muted); }
@media (min-width: 900px) {
  .scheda-head { padding-left: calc(var(--margin-col) + 40px); }
  .scheda-grid { grid-template-columns: var(--margin-col) minmax(0, 1fr); }
  .scheda-meta { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; }
  .scheda-meta dl { grid-template-columns: minmax(0, 1fr); }
}

/* Testo integrale degli articoli */
.testo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; overflow-wrap: break-word; }
.testo > * { margin: 0; min-width: 0; }
.testo h1, .testo h2, .testo h3, .testo h4, .testo h5 {
  margin-top: 18px;
  font-family: var(--font-text);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
  text-wrap: balance;
}
.testo h4 { margin-top: 8px; font-size: 18px; }
.testo h5 {
  margin-top: 6px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.testo ul, .testo ol { padding-left: 1.4em; display: grid; gap: 8px; }
.testo ol li::marker { font-family: var(--font-mono); font-size: .82em; color: var(--muted); }
.testo blockquote { padding-left: 16px; border-left: 2px solid var(--accent); font-size: 19px; line-height: 1.5; font-style: italic; color: var(--muted); }
.testo sup { font-size: .68em; line-height: 0; }
.testo aside {
  display: grid;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.testo aside p { margin: 0; }
.testo pre {
  overflow-x: auto;
  padding: 14px 16px;
  background: var(--wash);
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink);
  -webkit-overflow-scrolling: touch;
}
.testo code { font-family: var(--font-mono); font-size: .9em; }
.testo pre code { font-size: inherit; }
.testo pre kbd { font: inherit; font-weight: 500; color: var(--ink); }
.testo pre samp { font: inherit; color: var(--muted); }
.testo pre i { font-style: normal; color: var(--muted); }
@media (max-width: 420px) { .testo pre { padding: 12px; font-size: 11.5px; } }

<!-- Archivio del Pensatoio: le schede stanno nel blocco JSON qui sotto. A parità di data conta l'ordine in cui compaiono. -->
<script type="application/json" id="archivio">
{
  "aggiornato": "2026-10-28",
  "argomenti": [
    "Behavioural economics",
    "Data analysis",
    "Financial markets",
    "Market watch",
    "New horizon"
  ],
  "schede": [
    {
      "id": "customer-segmentation-r",
      "titolo": "Customer segmentation con il machine learning in R",
      "data": "",
      "aggiunta": "2026-10-27",
      "argomento": "Data analysis",
      "temi": [
        "customer segmentation",
        "clustering",
        "R"
      ],
      "stimoli": [
        {
          "tipo": "Dati",
          "titolo": "Mall_Customers.csv",
          "nota": "200 clienti: genere, età, reddito annuo, punteggio di spesa"
        }
      ],
      "origini": [
        {
          "tipo": "Post del blog",
          "url": "https://giordanomargotti.blogspot.com/search/label/data%20analysis%20%2F%20CUSTOMER%20SEGMENTATION%20CON%20IL%20MACHINE%20LEARNING%20%28Rstudio%29"
        }
      ],
      "testo": "<p>Avere un approccio customer-centric è fondamentale per un'azienda. Così facendo si ottiene la possibilità di offrire un prodotto/servizio veramente rispondente alle necessità dei propri clienti assicurando la miglior customer journey possibile. Per ottenere questo risultato è necessario conoscere i propri clienti definendo degli identikit rappresentativi dei tratti caratteristici di ciascun utente e di quelli che li accomunano, le cosiddette personas. Le Personas sono degli avatar veri e propri della clientela che ci permettono di prendere decisioni strategiche in ottica di campagne marketing e di ottenimento di un adeguata Customer Experience.<\/p>\n<p>L’obiettivo di questo elaborato consiste nell’effettuare una segmentazione dei clienti di un Supermarket (il datase non è un reale business case). Questa tipologia di analisi permette all’azienda di scoprire, o confermare, se esistano dei diversi gruppi con clienti omogenei nelle caratteristiche e nei comportamenti.  La suddivisione della base clienti in gruppi in cui gli individui hanno caratteristiche e comportamenti simili (caratteristiche demografiche e comportamenti d’acquisto) permette all’azienda di individuare con precisione i clienti target.<\/p>\n<p>La segmentazione dei clienti è una delle applicazioni più importanti di Unsupervised Learning. In questo progetto di machine learning faremo uso del K-means quale algoritmo per il clustering.<\/p>\n<p>Per quanto ogni progetto di Data Science che si rispetti non si può prescindere dal seguire il Cross-industry standard process for data mining (CRISP-DM, nel 2015 IBM ha proposto una sua espansione, ASUM-DM), del quale salteremo tutta la fase di ETL avendo già a disposizione un dataset strutturato correttamente per le nostre necessità. Il CRISP-DM è uno standard internazionale che definisce un processo di Data Mining fornendo in maniera chiara un iter da seguire per una corretta data discovery.<\/p>\n<p>Per l’analisi delle principali statistiche descrittive vengono prese in considerazione tutte le quattro variabili presenti nel nostro dataset: genere, età, reddito annuo e punteggio di spesa (normalizzato da 0 a 100). Per quanto riguarda le variabili quantitative:<\/p>\n<pre><code><kbd>summary(customer_data$Age)<\/kbd>\n<samp>    Min. 1st Qu.  Median    Mean 3rd Qu.    Max.\n   18.00   28.75   36.00   38.85   49.00   70.00<\/samp>\n<kbd>sd(customer_data$Age)<\/kbd>\n<samp>13.96901 #standard deviation<\/samp>\n\n<kbd>summary(customer_data$Annual.Income)<\/kbd>\n<samp>    Min. 1st Qu.  Median    Mean 3rd Qu.    Max.\n   15.00   41.50   61.50   60.56   78.00   137.0<\/samp>\n<kbd>sd(customer_data$Annual.Income)<\/kbd>\n<samp>26.26472 #standard deviation<\/samp>\n\n<kbd>summary(customer_data$Spending.Score)<\/kbd>\n<samp>    Min. 1st Qu.  Median    Mean 3rd Qu.    Max.\n    1.00   34.75   50.00   50.20   73.00    99.0<\/samp>\n<kbd>sd(customer_data$Spending.Score..1.100.)<\/kbd>\n<samp>25.82352 #standard deviation<\/samp><\/code><\/pre>\n<p>Per quanto riguarda la variabile dummy [male,female]:<\/p>\n<figure data-grafico=\"genere\"><\/figure>\n<p>Un’ulteriore analisi descrittiva riguarda la distribuzione delle frequenze.<\/p>\n<figure data-grafico=\"distribuzioni\"><\/figure>\n<p>Dopo le analisi descrittive si può procedere con la fase di Processing andando a settare i parametri dell’algoritmo scelto.<\/p>\n<p>Per quanto riguarda il K-means:<\/p>\n<ol><li>il primo passo è quello di valutare la possibilità di applicare un algoritmo di clustering al dataset.<\/li><li>Definire il numero di cluster (k) adeguato da produrre nell'output finale.<\/li><li>Suddividere il dataset in K cluster, assegnando ad ogni cluster degli elementi scelti a caso.<\/li><li>Calcolare i centroidi usando una misura di distanza.<\/li><li>Calcolare la distanza degli elementi del cluster dal centroide, ottenendo un errore quadratico (S.S.E.). La somma degli errori di tutti i cluster fornisce l’errore totale per la partizione, che rappresenta il valore da minimizzare.<\/li><li>Riassegnazione degli elementi del campione in base al più vicino al centroide.<\/li><li>E’ necessario ripetere i passaggi precedenti in un ciclo iterativo fino a che non si raggiunga il valore minimo dell’errore totale.<\/li><\/ol>\n<p>Per valutare la possibilità di applicare algoritmi di clustering al nostro dataset utilizziamo un metodo basato sul calcolo della statistica di Hopkins oppure su un metodo visuale basato sulle matrici di dissimilarità.<\/p>\n<p>Misure per definire il numero di Cluster:<\/p>\n<h3>Elbow Method<\/h3>\n<figure data-grafico=\"elbow\"><\/figure>\n<p>Dal grafico riportato, possiamo dedurre che 6 sia il numero appropriato di cluster in quanto si nota un importante cambio di pendenza della curva proprio a ridosso.<\/p>\n<h3>Silhouette<\/h3>\n<figure data-grafico=\"silhouette\"><\/figure>\n<p>L’approccio è simile al precedente, poiché anche in questo caso calcoliamo i valori della metrica per una serie di clusterizzazioni per le quali facciamo variare il numero di cluster da 2 a 10, trovando un valore ottimale a ridosso di 6.<\/p>\n<h3>Gap Statistic<\/h3>\n<figure data-grafico=\"gap\"><\/figure>\n<p>Il metodo confronta la metrica chiamata within intra-cluster di diverse clusterizzazioni con la stessa metrica ricavata da una serie di distribuzioni uniformi dei dati. Il numero di cluster ottimale è quello che massimizza la gap statistic, ovvero da 6 cluster in poi.<\/p>\n<p>Una volta definito il numero ideale di Cluster possiamo far partire il nostro algoritmo, ottenendo i risultati seguenti:<\/p>\n<pre><code><samp>K-means clustering with 6 clusters of sizes 45, 22, 21, 38, 35, 39\n\nCluster means:\n       Age Annual.Income Spending.Score\n1 56.15556      53.37778       49.08889\n2 25.27273      25.72727       79.36364\n3 44.14286      25.14286       19.52381\n4 27.00000      56.65789       49.13158\n5 41.68571      88.22857       17.28571\n6 32.69231      86.53846       82.12821<\/samp><\/code><\/pre>\n<figure data-grafico=\"segmenti\"><\/figure>\n<p>Come possiamo notare dai risultati ottenuti i Cluster 1 e 4 contengono consumatori con salari annui e attitudini di spesa simili, ma ciò che colpisce è la netta differenza di età media, 56 anni per il cluster 1 in confronto ai 29 anni per il cluster 4.<\/p>\n<p>Mentre osservando il cluster 2 ed il cluster 3 possiamo notare come le attitudini di spesa a parità di reddito annuo siano diametralmente opposte tra chi a 25 e chi 44 anni. I giovani a parità di reddito spendono più del doppio dei consumatori più maturi.<\/p>\n<p>Possiamo notare la stessa cosa osservando il cluster 5 ed il cluster 6. A parità di reddito i consumatori del cluster 6, con 32 anni di media, spendono più del doppio dei consumatori del cluster 5, con 41 anni di media.<\/p>\n<p>Queste evidenze ci portano ad importanti conclusioni: Per quattro cluster di consumatori, indipendentemente dal reddito annuo i consumatori con età compresa tra i 25 ed i 32 spendono più del doppio dei consumatori di età compresa tra i 41 ed i 56 anni. Mentre per le restanti due classi i comportamenti di acquisto non sono trainati da differenze di età o reddito.<\/p>\n<h3>Codice in RStudio<\/h3>\n<pre><code>customer_data=read.csv(\"Mall_Customers.csv\")\nstr(customer_data)\nnames(customer_data)\n\n<i>#display the first six rows of our dataset using the head() function<\/i>\n<i>#and use the summary() function to output summary of it.<\/i>\nhead(customer_data)\n<i>#and use the summary() and sd() function to output summary metrics of it.<\/i>\nsummary(customer_data$Age)\nsd(customer_data$Age)\nsummary(customer_data$Annual.Income..k..)\nsd(customer_data$Annual.Income..k..)\nsummary(customer_data$Spending.Score..1.100.)\nsd(customer_data$Spending.Score..1.100.)\n<i>#Customer Gender Visualization<\/i>\na=table(customer_data$Gender)\nbarplot(a,main=\"Using BarPlot to display Gender Comparision\",\n        ylab=\"Count\",\n        xlab=\"Gender\",\n        col=rainbow(2),\n        legend=rownames(a))\n\n<i>#visualize a pie chart to observe the ratio of male and female distribution<\/i>\ninstall.packages(\"plotrix\")\npct=round(a/sum(a)*100)\nlbs=paste(c(\"Female\",\"Male\"),\" \",pct,\"%\",sep=\" \")\nlibrary(plotrix)\npie3D(a,labels=lbs,\n      main=\"Pie Chart Depicting Ratio of Female and Male\")\n\n<i>#plot a histogram to view the distribution to plot the frequency of customer ages<\/i>\nsummary(customer_data$Age)\nhist(customer_data$Age,\n     col=\"blue\",\n     main=\"Histogram to Show Count of Age Class\",\n     xlab=\"Age Class\",\n     ylab=\"Frequency\",\n     labels=TRUE)\nboxplot(customer_data$Age,\n        col=\"#ff0066\",\n        main=\"Boxplot for Descriptive Analysis of Age\")\n\n<i>#plot a histogram to view the distribution to plot the frequency of customer Annual Income<\/i>\nsummary(customer_data$Annual.Income..k..)\nhist(customer_data$Annual.Income..k..,\n     col=\"#660033\",\n     main=\"Histogram for Annual Income\",\n     xlab=\"Annual Income Class\",\n     ylab=\"Frequency\",\n     labels=TRUE)\nboxplot(customer_data$Age,\n        col=\"#00665f\",\n        main=\"Boxplot for Descriptive Analysis of Annual Income\")\nplot(density(customer_data$Annual.Income..k..),\n     col=\"yellow\",\n     main=\"Density Plot for Annual Income\",\n     xlab=\"Annual Income Class\",\n     ylab=\"Density\")\npolygon(density(customer_data$Annual.Income..k..),\n        col=\"#66005c\")\n<i>#plot a histogram to view the distribution to plot the frequency of customer Spending Score<\/i>\nhist(customer_data$Spending.Score..1.100.,\n     main=\"HistoGram for Spending Score\",\n     xlab=\"Spending Score Class\",\n     ylab=\"Frequency\",\n     col=\"#6600cc\",\n     labels=TRUE)\nboxplot(customer_data$Spending.Score..1.100.,\n       col=\"#990000\",\n        main=\"BoxPlot for Descriptive Analysis of Spending Score\")\n\n<i>#K-MEANS CLUSTERING<\/i>\n\n<i>#1.<\/i>\n<i>#Per valutare la possibilità di applicare algoritmi di clustering<\/i>\n<i>#al nostro dataset utilizziamo un metodo basato sul calcolo della<\/i>\n<i>#statistica di Hopkins:<\/i>\nlibrary(clustertend)\nhopkins(customer_data, n=nrow(customer_data)-1,byrow = F, header = F)\n\n<i>#2.<\/i>\n<i>#Elbow method<\/i>\nlibrary(purrr)\nset.seed(123)\n<i># function to calculate total intra-cluster sum of square<\/i>\niss &lt;- function(k) {\n  kmeans(customer_data[,3:5],k,iter.max=100,nstart=100,algorithm=\"Lloyd\" )$tot.withinss\n}\nk.values &lt;- 1:10\niss_values &lt;- map_dbl(k.values, iss)\nplot(k.values, iss_values,\n     type=\"b\", pch = 19, frame = FALSE,\n     xlab=\"Number of clusters K\",\n     ylab=\"Total intra-clusters sum of squares\")\n<i>#Silhouette Method<\/i>\nlibrary(NbClust)\nlibrary(factoextra)\nfviz_nbclust(customer_data[,3:5], kmeans, method = \"silhouette\")\n<i>#Gap Statistic<\/i>\nset.seed(125)\nstat_gap &lt;- clusGap(customer_data[,3:5], FUN = kmeans, nstart = 25,\n                    K.max = 10, B = 50)\nfviz_gap_stat(stat_gap)\n\n<i>#K-MEANS<\/i>\nk6&lt;-kmeans(customer_data[,3:5],6,iter.max=100,nstart=50,algorithm=\"Lloyd\")\nk6\n<i>#PRINCIPAL COMPONENT<\/i>\npcclust=prcomp(customer_data[,3:5],scale=FALSE) <i>#principal component analysis<\/i>\nsummary(pcclust)\npcclust$rotation[,1:2]\n<i>#PLOT CLUSTER<\/i>\nset.seed(1)\nggplot(customer_data, aes(x =Annual.Income..k.., y = Spending.Score..1.100.)) +\n  geom_point(stat = \"identity\", aes(color = as.factor(k6$cluster))) +\n  scale_color_discrete(name=\" \",\n                       breaks=c(\"1\", \"2\", \"3\", \"4\", \"5\",\"6\"),\n                       labels=c(\"Cluster 1\", \"Cluster 2\", \"Cluster 3\", \"Cluster 4\", \"Cluster 5\",\"Cluster 6\")) +\n  ggtitle(\"Segments of Mall Customers\", subtitle = \"Using K-means Clustering\")\n\nkCols=function(vec){cols=rainbow (length (unique (vec)))\nreturn (cols[as.numeric(as.factor(vec))])}\ndigCluster&lt;-k6$cluster; dignm&lt;-as.character(digCluster); <i># K-means clusters<\/i>\nplot(pcclust$x[,1:2], col =kCols(digCluster),pch =19,xlab =\"K-means\",ylab=\"classes\")\nlegend(\"bottomleft\",unique(dignm),fill=unique(kCols(digCluster)))<\/code><\/pre>",

      "testo": "<blockquote>“le decisioni degli individui sono imprevedibili ma non sono casuali”<\/blockquote>\n<p>E’ possibile battere i mercati finanziari in termini di rendimento? E’ possibile trarre profitto dalle fluttuazioni dei mercati finanziari sfruttando le eventuali inefficienze (ottenere un extra rendimento rispetto ad una strategia buy &amp; hold)? Precisiamo subito che vi è da sempre un acceso dibattito scientifico sull’argomento e che siamo ben lontani da una risposta definitiva. Iniziamo ad addentrarci in questa never ending story esplorando la teoria dei mercati efficienti (EMH – Eugene Fama 1970). Su questa teoria si basano tutti i principali modelli economici in ambito finanziario, sviluppati nella seconda parte del XX secolo. Secondo la sua definizione, il mercato si considera efficiente quando i prezzi riflettono completamente tutte le informazioni disponibili e non sono possibili ulteriori operazioni di arbitraggio. La concorrenza del mercato è in grado di garantire un livello costante di equilibrio nei rendimenti delle attività, e quindi l’uguaglianza tra domanda e offerta. Ciò è possibile grazie alla diversa natura degli agenti economici che popolano i mercati finanziari. Se gli individui sono investitori razionali, prenderanno correttamente le loro decisioni di investimento valutando i titoli in base al loro valore fondamentale. Se alcuni soggetti operano in modo irrazionale, le loro strategie di investimento inefficienti seguiranno percorsi casuali (Random walk), privi di correlazione tra loro. Le strategie di investimento inefficienti non correlate si annullano in media senza influenzare il prezzo di equilibrio. Se gli operatori utilizzeranno strategie che sono correlate tra loro, allora interverrà qualche soggetto definito arbitraggista il cui comportamento ripristinerà l’equilibrio. L’EMH è coerente con l’ipotesi che i prezzi delle azioni seguano un processo random walk. Come sostiene Malkiel, se i prezzi seguono un andamento casuale, è impossibile ottenere un profitto aggiuntivo rispetto a una strategia buy and hold: “… Se i prezzi seguono un andamento casuale, una scimmia bendata che lancia freccette su una lista di titoli potrebbe creare un portafoglio che ha performance simili a quelle di un portafoglio costruito da esperti …”.<\/p>\n<p>Il processo di trasmissione delle informazioni ai prezzi non è sempre lineare e immediato. È importante sottolineare che, anche in presenza di una corretta diffusione delle informazioni, le decisioni di soggetti razionali, correttamente informati, potrebbero differire nei tempi, portando a un processo di aggiustamento dei prezzi distribuito su un periodo più o meno lungo, certamente non immediato. Definito questo concetto, è plausibile pensare che deviazioni sistematiche dall’efficienza possono persistere anche per periodi medio-lunghi.<\/p>\n<p>Quindi possiamo affermare che la presenza di finestre temporali, in cui si verifichino allontanamenti dall’equilibrio di mercato, sia inevitabile. Finestre che quando si aprono permettono agli arbitraggisti di individuare le inefficienza presenti e traendone vantaggio prima che la finestra si richiuda. Le inefficienze individuabili sono molteplici e possono differire in natura e modalità variando ad ogni finestra temporale.<\/p>\n<p>La ragione di queste deviazioni dall’efficienza va ricercata nelle diverse aspettative presentate dai partecipanti al mercato. Le aspettative eterogenee degli investitori sono dovute a diversi livelli di razionalità e di informazione. Sulla base di evidenze empiriche che dimostrano la fallacia di alcuni assiomi su cui si basa l’economia finanziaria tradizionale, il mondo accademico è alla ricerca di nuovi metodi per studiare i mercati finanziari. La finanza comportamentale si basa su queste evidenze. Lo studio della psicologia degli investitori, con l’obiettivo di spiegare queste anomalie, ha portato a un’intersezione tra finanza e psicologia dando vita a questa nuova disciplina. La collaborazione tra finanza e altre scienze sociali, come nel caso della finanza comportamentale, potrebbe avvicinarci a una conoscenza più approfondita dei mercati finanziari, rendendoci consapevoli delle possibilità di un rendimento aggiuntivo. Una importante evidenza è presente nell’incapacità della teoria del mercato efficiente nello spiegare fenomeni irrazionali come le bolle speculative. A metà degli anni Settanta troviamo i primi studi di Daniel Kahneman e Amos Tversky, considerati i precursori della finanza comportamentale. Ci sono voluti diversi decenni per vedere questa disciplina affermarsi con forza. Queste importanti innovazioni, che hanno portato al conferimento di alcuni premi nobel, hanno trovato una forte resistenza in ambito accademico a causa dell’equilibrio intellettuale su cui si è cullata l’intera cultura economica. La principale critica mossa dai comportamentisti si basa sull’idea che il comportamento dei soggetti, ipotizzato dai modelli economici tradizionali, si discosti fortemente dalla realtà fattuale, generando una quantità di previsioni errate.<\/p>\n<p>L’individuo che per anni ha popolato i modelli economici è l’Homo Economicus, un soggetto perfettamente razionale che può sempre scegliere la migliore combinazione di beni per la propria dotazione. Da questa idea parte il tentativo della finanza comportamentale di fornirne una più realistica, sostituendo l’Homo Economicus con individui razionali ma fallibili, che compiono scelte sbagliate causate da bias cognitivi, un esempio è il narrow framing, e dotati di comportamenti adattivi. Vogliamo emulare il comportamento reale dell’homo sapiens, che spesso è irrazionale e la sua natura emotiva lo porta a una molteplicità di bias comportamentali. Gli esseri umani dispongono di tempo e capacità mentali in quantità limitata, quindi per giungere a dei giudizi utilizzano semplici regole pratiche, le euristiche. Nel 1936 John Maynard Keynes intuì che le emozioni, da lui definite “animal spirits”, avevano un ruolo importante nella formazione delle decisioni individuali, soprattutto nelle decisioni di investimento. L’evidenza empirica che minava le basi dell’EMH, aveva portato a un punto di non ritorno in cui era necessario acquisire consapevolezza da parte di tutto il mondo accademico. Nel 1985 al meeting dell’AFA (American Finance Association), De Bondt e Thaler tentarono di spiegare con un articolo il processo per cui alcuni titoli da un lato, buoni per diversi anni consecutivi, vengono qualificati come “buone aziende”, il che implica che continueranno a crescere rapidamente, viceversa altre aziende che subiscono lunghi periodi negativi acquisiscono una cattiva reputazione presso gli investitori. Il risultato è che si potrebbe prevedere una regressione verso la media per quelle aziende che si discostano dal loro valore intrinseco per lunghi periodi, minando la componente principale dell’EMH, che afferma che i prezzi delle azioni rappresentano il valore intrinseco dell’azienda in ogni momento, non permettendo l’idea che i prezzi possano discostarsi da esso.<\/p>\n<p>Nel 2004 Andrew W. Lo ha pubblicato un articolo in cui propone un nuovo quadro di riferimento, cercando di unire l’efficienza del mercato con le ipotesi e le critiche dei comportamentisti, applicando i principi dell’evoluzione, dell’adattamento e della selezione naturale alle interazioni finanziarie. Secondo l’ipotesi dei mercati adattivi (AMH), gli investitori, che sono razionali ma fallibili, imparano e si adattano ai cambiamenti dell’ambiente economico. Ciò significa che i mercati non sono sempre efficienti, ma di solito sono competitivi e adattivi, variando la loro efficienza nel tempo, in base all’ambiente e alle modifiche delle aspettative e delle preferenze degli investitori. Le ipotesi di A. Lo, relative ai principi di evoluzione, adattamento e selezione naturale, sono solidamente basate sulle recenti scoperte nel campo delle neuroscienze cognitive.<\/p>\n<p>Il neuroscienziato Paul Donald MacLean ha sviluppato il modello del Triune Brain alla fine degli anni Novanta (recenti studi scientifici cercano di superare questa visione del cervello “a strati gerarchici” mantenendo però l’idea che vi sia un costante influenzamento ambientale). Questo modello, che rappresenta la struttura e l’evoluzione del cervello, ci fa capire che il cervello umano è il risultato di un processo evolutivo. Ogni singolo componente del cervello umano può essere considerato il risultato di un lungo processo di adattamento condotto dall’individuo (e dalla specie a cui appartiene) per sopravvivere in determinate situazioni. I concetti evolutivi sono apparsi in numerose pubblicazioni economiche e finanziarie. L’ipotesi, guardata sotto una prospettiva evolutiva, parte dall’osservazione degli individui come organismi che hanno sviluppato, attraverso generazioni di selezione naturale, la capacità di massimizzare la possibilità di sopravvivenza dei propri geni. Questa prospettiva implica che il comportamento non è necessariamente intrinseco ed esogeno, ma si evolve anche secondo la logica della selezione naturale e dipende in particolare dall’ambiente in cui avviene la selezione. Questa non opera solo sul materiale genetico, ma anche sulle norme sociali e culturali. Per far funzionare questa prospettiva in un contesto economico, è necessario considerare l’idea di “razionalità limitata“.<\/p>\n<p>Considerare gli individui umani con una razionalità limitata è in contrasto con i modelli generali in cui gli individui hanno una razionalità illimitata e sono perfettamente informati. A questo punto ci chiediamo cosa determini il punto in cui un individuo interrompe il processo di ottimizzazione e raggiunge una soluzione soddisfacente. Se questo momento è determinato dal solito calcolo costi-benefici questo presuppone che la soluzione ottimale sia nota, potendola determinare, e siamo di nuovo nell’ipotesi di razionalità illimitata. Una soluzione a questa domanda potrebbe essere fornita da una prospettiva evolutiva: la risposta adeguata alla domanda su come gli individui determinano il punto di soddisfazione è che viene determinato in modo non analitico, ma per tentativi ed errori. La sostituzione di agenti economici perfettamente razionali con individui a razionalità limitata implica la necessità di un’attività di apprendimento evolutivo da parte loro. Attraverso la selezione naturale gli individui compiono scelte basate sulle loro esperienze passate e imparano ricevendo un feedback positivo o negativo in base ai risultati ottenuti. Senza feedback non imparano. In questo modo gli individui, sviluppando delle euristiche, saranno in grado di risolvere diverse sfide economiche. Se il contesto di riferimento rimane stabile, l’euristica si adatterà, mirando a produrre soluzioni approssimativamente ottimali per gli individui. Ma se il contesto cambia, non dobbiamo sorprenderci se l’euristica, che si è sviluppata sulla base dell’esperienza del vecchio ambiente, non è adatta al nuovo. In tal caso l’euristica produrrà pregiudizi comportamentali, i quali porteranno gli investitori a basarsi sulle stesse informazioni ma giungendo a conclusioni diverse. È ragionevole considerare investitori con razionalità limitata e con aspettative eterogenee. Per rappresentare questo contesto, definito nell’ambito dell’economia computazionale come Complex Adaptive System (CAS), è necessario definire un costrutto teorico con agenti che hanno comportamenti robusti che saranno rappresentati da algoritmi (Agent Based Model). Se modelli complessi di questo genere siano in grado di rappresentare anche solo approssimativamente il comportamento degli individui all’interno dei mercati finanziari rimane un dibattito tutt’ora in corso.<\/p>"
